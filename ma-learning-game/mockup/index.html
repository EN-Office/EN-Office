<title>Deal Tamers チュートリアル</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: 9:16 の縦画面ステージを画面中央に置き、内部はコンテナ幅(cqw)基準で拡縮。世界観は「夕暮れのマーケット大陸」で単一テーマ。 */
:root{
  --night:#0e1a17;      /* 大陸の夜 */
  --dusk:#1d3a46;       /* 夕空の上 */
  --ember:#f0a14a;      /* 取引成立の琥珀（主アクセント） */
  --ember-deep:#c76d14;
  --leaf:#5fc192;       /* 成長・統合 */
  --rose:#ef6b5b;       /* リスク */
  --paper:#f6efe2;      /* カード地 */
  --ink:#16251f;
  --mist:#a9bab2;
  --line:rgba(255,255,255,.12);
  --font-display:"Dela Gothic One","Hiragino Sans","Noto Sans JP",sans-serif;
  --font-body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --font-data:"IBM Plex Mono",ui-monospace,monospace;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(120% 80% at 50% 0%,#203f3a 0%,#0a1210 70%);color:#fff;font-family:var(--font-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px;
  display:flex;align-items:center;justify-content:center;overflow:hidden}
.stage{height:min(calc(100% - 0px),calc((100vw - 32px) * 16 / 9));aspect-ratio:9/16;max-width:100%;position:relative;
  border-radius:3.2vmin;overflow:hidden;box-shadow:0 0 0 1px rgba(255,255,255,.08),0 30px 80px rgba(0,0,0,.55);container-type:size;
  background:linear-gradient(180deg,var(--dusk) 0%,#2a4a50 38%,#c9864a 78%,#e9a65b 100%)}
.screen{position:absolute;inset:0;font-size:3.9cqw;line-height:1.6;display:flex;flex-direction:column;overflow:hidden}
.screen.dark{background:linear-gradient(180deg,#10201c 0%,#132a26 60%,#0e1a17 100%)}
.screen.paper{background:var(--paper);color:var(--ink)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible{outline:.18em solid var(--ember);outline-offset:.12em}
h1,h2,h3,p{margin:0}
.disp{font-family:var(--font-display);font-weight:400;letter-spacing:.01em}
.mono{font-family:var(--font-data)}
.fade{animation:fade .45s ease both}
@keyframes fade{from{opacity:0;transform:translateY(.6em)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4%)}}
@keyframes drop{0%{transform:translateY(-120%);opacity:0}60%{transform:translateY(4%);opacity:1}100%{transform:none}}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-6%)}75%{transform:translateX(6%)}}
@keyframes glow{0%,100%{opacity:.6}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* 共通パーツ */
.topbar{display:flex;align-items:center;gap:.6em;padding:.9em 1em .4em;flex:none}
.back{width:2.2em;height:2.2em;border-radius:50%;background:rgba(0,0,0,.28);display:grid;place-items:center;font-size:1em}
.topbar .ttl{font-weight:700;font-size:.92em;flex:1;min-width:0}
.chip{display:inline-flex;align-items:center;gap:.3em;font-size:.68em;padding:.2em .7em;border-radius:99em;background:rgba(255,255,255,.12);font-weight:700;letter-spacing:.04em;white-space:nowrap}
.chip.ember{background:var(--ember);color:#1b1206}
.chip.leaf{background:var(--leaf);color:#0b2117}
.chip.rose{background:var(--rose);color:#fff}
.btn{display:flex;align-items:center;justify-content:center;gap:.5em;width:100%;padding:.85em 1em;border-radius:1em;font-weight:900;font-size:1em;
  background:linear-gradient(180deg,#ffc477,var(--ember));color:#2a1604;box-shadow:0 .28em 0 var(--ember-deep)}
.btn:active{transform:translateY(.15em);box-shadow:0 .12em 0 var(--ember-deep)}
.btn.ghost{background:rgba(255,255,255,.1);color:#fff;box-shadow:none;font-weight:700}
.btn[disabled]{opacity:.4;pointer-events:none}
.body{flex:1;min-height:0;overflow-y:auto;padding:.4em 1em 1em;display:flex;flex-direction:column;gap:.8em}
.body>*{flex-shrink:0}
.foot{flex:none;padding:.6em 1em 1.1em;display:flex;flex-direction:column;gap:.5em}
.card{background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:1em;padding:.9em}
.pcard{background:var(--paper);color:var(--ink);border-radius:1em;padding:.9em}
.tip{display:flex;gap:.6em;align-items:flex-start}
.tip .face{flex:none;width:3em;height:3em}
.bubble{background:var(--paper);color:var(--ink);border-radius:.2em 1em 1em 1em;padding:.6em .8em;font-size:.86em;line-height:1.55;position:relative}
.bubble b{color:var(--ember-deep)}
.label{font-size:.66em;letter-spacing:.14em;color:var(--mist);font-weight:700}
.big{font-family:var(--font-display);font-size:1.5em;line-height:1.25}
.meter{height:.6em;border-radius:99em;background:rgba(255,255,255,.12);overflow:hidden}
.meter i{display:block;height:100%;border-radius:99em;background:var(--leaf);transition:width .5s}
.row{display:flex;gap:.6em;align-items:center}
.grow{flex:1;min-width:0}
.sp{justify-content:space-between}
.small{font-size:.78em}
.xs{font-size:.66em}
.muted{color:var(--mist)}

/* 目次 */
.idx-hero{position:relative;flex:none;height:40%;display:flex;flex-direction:column;justify-content:flex-start;padding:1.6em 1.2em 0}
.idx-hero svg{position:absolute;left:0;right:0;bottom:0;width:100%;height:auto}
.logo{font-family:var(--font-display);font-size:2.5em;line-height:1.05;text-shadow:0 .08em 0 rgba(0,0,0,.25)}
.logo small{display:block;font-family:var(--font-body);font-size:.32em;font-weight:700;letter-spacing:.2em;color:#ffd29a;margin-bottom:.5em}
.idx-list{flex:1;min-height:0;background:var(--night);padding:1em;display:flex;flex-direction:column;gap:.55em;overflow-y:auto}
.idx-item{display:flex;align-items:center;gap:.8em;padding:.7em .8em;border-radius:1em;background:rgba(255,255,255,.06);border:1px solid var(--line);text-align:left;transition:background .2s}
.idx-item:hover{background:rgba(240,161,74,.14)}
.idx-item .n{flex:none;width:2.4em;height:2.4em;border-radius:.7em;display:grid;place-items:center;font-family:var(--font-display);font-size:1em;background:var(--ember);color:#2a1604}
.idx-item:nth-child(3) .n{background:var(--leaf);color:#0b2117}
.idx-item:nth-child(4) .n{background:#ffd29a}
.idx-item:nth-child(5) .n{background:#8fb5ff;color:#0b1730}
.idx-item:nth-child(6) .n{background:#b48cff;color:#1d0f3a}
.idx-item:nth-child(7) .n{background:var(--rose);color:#fff}
.idx-item .t{font-weight:900;font-size:.95em;line-height:1.35}
.idx-item .d{font-size:.7em;color:var(--mist);line-height:1.45}
.idx-item .go{flex:none;color:var(--ember);font-size:1.1em}

/* オープニング */
.op{position:absolute;inset:0;display:flex;flex-direction:column}
.op-art{flex:1;min-height:0;display:grid;place-items:center;position:relative}
.op-art svg{width:100%;height:100%}
.op-text{flex:none;padding:1em 1.3em 0;min-height:7.5em}
.op-text p{font-size:1.08em;line-height:1.75;font-weight:700;text-shadow:0 .06em .3em rgba(0,0,0,.4)}
.op-text p em{font-style:normal;color:#ffd29a}
.taphint{text-align:center;font-size:.7em;letter-spacing:.3em;color:#ffd29a;padding:.6em 0 1.4em;animation:glow 1.6s infinite}
.choice{display:flex;align-items:center;gap:.7em;padding:.6em;border-radius:1em;background:rgba(0,0,0,.25);border:2px solid transparent;text-align:left;width:100%}
.choice.on{border-color:var(--ember);background:rgba(240,161,74,.18)}
.choice .ic{flex:none;width:3.4em;height:3.4em}

/* ミニゲーム */
.hud{display:flex;gap:.5em}
.hud .card{flex:1;padding:.5em .6em;text-align:center}
.hud .v{font-family:var(--font-display);font-size:1.3em;line-height:1.2}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:.5em}
.tile{aspect-ratio:1/1;border-radius:.9em;background:linear-gradient(160deg,#294b45,#173029);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.15em;font-size:.82em;font-weight:700;position:relative;overflow:hidden}
.tile .ico{font-size:1.6em;line-height:1}
.tile.risk{background:linear-gradient(160deg,#ff8a7a,var(--rose));animation:pop .35s both,shake .35s .35s}
.tile.good{background:linear-gradient(160deg,#9ce0bd,var(--leaf));color:#0b2117;animation:pop .35s both}
.tile.safe{background:#2b3a36;color:var(--mist);animation:pop .35s both}
.tile.flagged{border:2px solid var(--ember);background:rgba(240,161,74,.18)}
.tile.missed{outline:.15em dashed var(--rose);outline-offset:-.3em}
.tile .res{font-size:.78em;line-height:1.3;text-align:center;padding:0 .3em}
.timer{height:.5em;border-radius:99em;background:rgba(255,255,255,.12);overflow:hidden}
.timer i{display:block;height:100%;background:linear-gradient(90deg,var(--rose),var(--ember));transition:width 1s linear}
.toast{position:absolute;left:50%;top:38%;transform:translateX(-50%);background:var(--rose);color:#fff;font-weight:900;padding:.4em 1em;border-radius:99em;font-size:1em;animation:pop .3s both;pointer-events:none;white-space:nowrap;z-index:5}
.toast.g{background:var(--leaf);color:#0b2117}
.rank{font-family:var(--font-display);font-size:5em;line-height:1;color:var(--ember);text-align:center;animation:pop .6s both;text-shadow:0 .06em 0 var(--ember-deep)}

/* 買収フロー */
.steps{display:flex;gap:.25em;padding:0 1em .4em;flex:none}
.steps span{flex:1;height:.32em;border-radius:99em;background:rgba(255,255,255,.15)}
.steps span.on{background:var(--ember)}
.steps span.done{background:var(--leaf)}
.stepname{padding:0 1em;display:flex;align-items:baseline;gap:.6em;flex:none}
.stepname .disp{font-size:1.45em}
.cand{display:flex;gap:.7em;align-items:center;text-align:left;width:100%;padding:.6em;border-radius:1em;background:rgba(255,255,255,.06);border:2px solid var(--line)}
.cand.on{border-color:var(--ember);background:rgba(240,161,74,.15)}
.cand.ng{border-color:var(--rose);animation:shake .35s}
.cand .ic{flex:none;width:3.6em;height:3.6em}
.bs{display:grid;grid-template-columns:1fr 1fr;gap:.3em;font-size:.86em}
.bs div{padding:.55em .6em;border-radius:.6em;background:#fff;color:var(--ink)}
.bs .as{grid-row:span 2;background:#e3f2ea}
.bs .li{background:#fde3dc}
.bs .eq{background:#ffe9c8}
.bs .k{font-size:.72em;color:#5b6b64;font-weight:700}
.bs .v{font-family:var(--font-data);font-weight:600;font-size:1.1em}
input[type=range]{width:100%;accent-color:var(--ember)}
.band{position:relative;height:2.2em;border-radius:.6em;background:rgba(255,255,255,.08);margin-top:.4em}
.band .zone{position:absolute;top:0;bottom:0;background:rgba(95,193,146,.35);border-radius:.6em}
.band .pin{position:absolute;top:-.3em;bottom:-.3em;width:.3em;background:var(--ember);border-radius:.2em;transform:translateX(-50%);transition:left .1s}
.band .ticks{position:absolute;left:0;right:0;bottom:-1.5em;display:flex;justify-content:space-between;font-size:.62em;color:var(--mist)}
.opt{width:100%;text-align:left;padding:.7em .8em;border-radius:.9em;background:rgba(255,255,255,.08);border:1px solid var(--line);font-size:.9em;font-weight:700}
.opt:hover{background:rgba(240,161,74,.16)}
.talk{display:flex;flex-direction:column;gap:.5em}
.talk .me{align-self:flex-end;background:var(--ember);color:#2a1604;border-radius:1em .2em 1em 1em;padding:.5em .8em;font-size:.86em;font-weight:700;max-width:85%}
.dd{display:grid;grid-template-columns:1fr 1fr;gap:.5em}
.dd button{border-radius:1em;padding:.7em;background:rgba(255,255,255,.07);border:2px solid var(--line);text-align:left;display:flex;flex-direction:column;gap:.2em;min-height:6.2em}
.dd button.on{border-color:var(--ember);background:rgba(240,161,74,.15)}
.dd .an{font-weight:900}
.dd .ad{font-size:.7em;color:var(--mist);line-height:1.4}
.find{display:flex;gap:.6em;align-items:flex-start;padding:.6em .7em;border-radius:.8em;background:rgba(239,107,91,.15);border:1px solid rgba(239,107,91,.45);font-size:.84em;animation:fade .4s both}
.find.ok{background:rgba(95,193,146,.13);border-color:rgba(95,193,146,.45)}
.find.unk{background:rgba(255,255,255,.05);border:1px dashed var(--line);color:var(--mist)}
.clause{display:flex;flex-wrap:wrap;gap:.4em;margin-top:.45em}
.clause button{font-size:.76em;font-weight:700;padding:.35em .7em;border-radius:99em;background:rgba(255,255,255,.1);border:1px solid var(--line)}
.clause button.on{background:var(--ember);color:#2a1604;border-color:var(--ember)}
.clause button.bad{background:var(--rose);border-color:var(--rose)}
.pmi{display:flex;flex-direction:column;gap:.45em}
.pmi button{display:flex;gap:.6em;align-items:center;text-align:left;padding:.6em .7em;border-radius:.9em;background:rgba(255,255,255,.07);border:2px solid var(--line);font-size:.86em}
.pmi button.on{border-color:var(--leaf);background:rgba(95,193,146,.15)}
.pmi .fx{margin-left:auto;font-family:var(--font-data);font-size:.8em;white-space:nowrap}
.chain{display:flex;flex-direction:column;gap:0;position:relative}
.chain div{display:flex;gap:.6em;align-items:flex-start;padding:.45em 0;font-size:.84em;border-bottom:1px solid var(--line)}
.chain .mk{flex:none;width:1.5em;height:1.5em;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:.8em}
.mk.g{background:var(--leaf);color:#0b2117}.mk.w{background:var(--ember);color:#2a1604}.mk.b{background:var(--rose)}
.terms{display:flex;flex-wrap:wrap;gap:.35em}
.terms span{font-size:.7em;font-weight:700;padding:.3em .6em;border-radius:.4em;background:var(--paper);color:var(--ink)}

/* 成功メリット */
.city{position:relative;flex:none;height:42%}
.city>svg{position:absolute;inset:0;width:100%;height:100%}
.lot{position:absolute;bottom:13%;width:20%;height:14%;border-radius:.5em;border:.15em dashed rgba(255,210,154,.8);display:grid;place-items:center;font-size:.66em;font-weight:900;color:#ffd29a;background:rgba(0,0,0,.25)}
.lot .syn{position:absolute;top:-1.8em;white-space:nowrap}
.merit{display:flex;gap:.7em;align-items:center;padding:.65em .75em;border-radius:1em;background:rgba(255,255,255,.07);border:1px solid var(--line);animation:fade .5s both}
.merit .mi{flex:none;width:2.6em;height:2.6em;border-radius:.8em;display:grid;place-items:center;font-size:1.2em}
.merit .mt{font-weight:900;font-size:.9em;line-height:1.35}
.merit .md{font-size:.72em;color:var(--mist);line-height:1.45}
.merit .mv{margin-left:auto;font-family:var(--font-display);font-size:1.05em;white-space:nowrap;color:var(--leaf)}

/* 課金 */
.tabs{display:flex;gap:.3em;margin:0 1em;padding:.25em;border-radius:99em;background:rgba(0,0,0,.3);flex:none}
.tabs button{flex:1;padding:.45em;border-radius:99em;font-weight:900;font-size:.82em}
.tabs button.on{background:var(--ember);color:#2a1604}
.wallet{display:flex;gap:.4em}
.wallet span{font-family:var(--font-data);font-size:.78em;background:rgba(0,0,0,.35);padding:.25em .6em;border-radius:99em}
.pass{border-radius:1.1em;padding:.9em;background:linear-gradient(135deg,#3a2a16,#7a4a1c 55%,#f0a14a);position:relative}
.pass .big{font-size:1.25em}
.shopgrid{display:grid;grid-template-columns:1fr 1fr;gap:.5em}
.item{border-radius:1em;padding:.7em;background:rgba(255,255,255,.07);border:1px solid var(--line);display:flex;flex-direction:column;gap:.3em;position:relative}
.item .art{height:3.6em;display:grid;place-items:center}
.item .art svg{height:100%;width:auto}
.item .nm{font-weight:900;font-size:.84em;line-height:1.35}
.item .ds{font-size:.66em;color:var(--mist);line-height:1.4}
.price{margin-top:auto;font-family:var(--font-data);font-weight:600;font-size:.82em;text-align:center;padding:.3em;border-radius:.6em;background:var(--ember);color:#2a1604}
.pin-n{position:absolute;top:-.5em;left:-.5em;width:1.7em;height:1.7em;border-radius:50%;background:var(--rose);color:#fff;font-weight:900;font-size:.72em;display:grid;place-items:center;box-shadow:0 0 0 .2em var(--night)}
.ring{position:relative;width:86%;margin:0 auto;aspect-ratio:1/1}
.ring svg{width:100%;height:100%}
.legend{display:flex;flex-direction:column;gap:.4em}
.legend button{display:flex;gap:.6em;align-items:flex-start;text-align:left;padding:.55em .65em;border-radius:.8em;background:rgba(255,255,255,.06);border:1px solid var(--line);font-size:.82em}
.legend button.on{border-color:var(--ember);background:rgba(240,161,74,.14)}
.legend .num{flex:none;width:1.6em;height:1.6em;border-radius:50%;background:var(--rose);display:grid;place-items:center;font-weight:900;font-size:.8em}
.rule{border-radius:1em;padding:.8em .9em;background:var(--paper);color:var(--ink);font-size:.82em;line-height:1.6}
.rule b{color:var(--ember-deep)}
.mix{display:flex;height:1.4em;border-radius:.5em;overflow:hidden;font-size:.6em;font-weight:900}
.mix span{display:grid;place-items:center;color:#1b1206;white-space:nowrap;overflow:hidden}

/* 用語の補足（！マーク） */
.term{border-bottom:1px dotted currentColor;cursor:help}
.q{display:inline-grid;place-items:center;width:1.15em;height:1.15em;margin-left:.15em;border-radius:50%;background:var(--ember);color:#2a1604;font-size:.72em;font-weight:900;font-family:var(--font-body);line-height:1;vertical-align:.25em;cursor:pointer;font-style:normal;text-shadow:none;letter-spacing:0}
.paper .q,.pcard .q,.bubble .q,.bs .q,.rule .q,.terms .q{background:var(--ember-deep);color:#fff}
.modal{position:absolute;inset:0;z-index:20;background:rgba(5,12,10,.62);display:flex;align-items:flex-end;font-size:3.9cqw;animation:fade .2s both}
.sheet{width:100%;background:var(--paper);color:var(--ink);border-radius:1.4em 1.4em 0 0;padding:1.2em 1.2em 1.4em;display:flex;flex-direction:column;gap:.7em;max-height:80%;overflow-y:auto}
.sheet .hd{display:flex;align-items:flex-start;gap:.7em}
.sheet .hd .face{flex:none;width:3em;height:3em}
.sheet .tn{font-family:var(--font-display);font-size:1.4em;line-height:1.25}
.sheet .en{font-family:var(--font-data);font-size:.72em;color:#5b6b64}
.sheet .ex{font-size:.92em;line-height:1.75}
.sheet .gm{font-size:.82em;line-height:1.6;background:#ece2cf;border-radius:.8em;padding:.6em .8em}
.sheet .gm b{color:var(--ember-deep)}
.sheet .kind{align-self:flex-start}
</style>

<div class="stage" id="stage" aria-live="polite"></div>

<script>
(function(){
const $stage=document.getElementById('stage');
const S={}; // screens
let timers=[];
function clearTimers(){timers.forEach(t=>{clearTimeout(t);clearInterval(t)});timers=[]}
function later(fn,ms){const t=setTimeout(fn,ms);timers.push(t);return t}
function every(fn,ms){const t=setInterval(fn,ms);timers.push(t);return t}
function mount(html,cls){clearTimers();glSeen=new Set();$stage.innerHTML='<div class="screen '+(cls||'')+'">'+html+'</div>';return $stage.firstChild}
function go(name){if(location.hash.slice(1)===name){route()}else{location.hash=name}}
function topbar(title,extra){return '<div class="topbar"><button class="back" data-go="" aria-label="目次へ戻る">←</button><div class="ttl">'+title+'</div>'+(extra||'')+'</div>'}
function bind(root){root.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.go)))}

/* ---------- キャラクター ---------- */
function beast(o){
  o=Object.assign({c:'#f0a14a',d:'#c76d14',horn:'spike',mood:'smile',belly:'#ffd9a8',extra:''},o);
  const horns={
    spike:'<polygon points="30,30 38,4 50,28" fill="'+o.c+'"/><polygon points="70,28 82,4 90,30" fill="'+o.c+'"/>',
    ear:'<rect x="30" y="4" width="12" height="30" rx="6" fill="'+o.c+'"/><rect x="78" y="4" width="12" height="30" rx="6" fill="'+o.c+'"/>',

/* ---------- 2. ミニゲーム ---------- */
S.minigame=function(){
  const ROOMS=[['🏭','工場'],['📒','経理'],['📜','契約書'],['👥','人事'],['🚪','社長室'],['🏦','銀行'],['📦','倉庫'],['🧾','税務'],['🗂','顧客台帳']];
  const PUZ=[
    {risks:{1:'簿外債務',6:'在庫の水増し',8:'売掛金の焦げつき'},open:[4],
     clues:['棚卸しの数が、帳簿よりはっきり多い。','社長室の隣のどこかに、帳簿にない借入の書類があるらしい。','大口の取引先からの入金が、半年止まっている。']},
    {risks:{2:'訴訟リスク',3:'キーマン依存',5:'保証債務'},open:[0],
     clues:['最近、取引先から内容証明郵便が届いた。','技術の要の工場長が、転職を考えているという噂。','社長が知人の会社の借金を保証しているらしい。']},
    {risks:{0:'設備の老朽化',5:'簿外債務',7:'追徴課税'},open:[4],
     clues:['3年前の税務調査の指摘が、まだ片づいていない。','工場の主力機械は、30年前のもの。','金融機関に、決算書に載っていない借入がある。']}
  ];
  const NB=i=>{const r=Math.floor(i/3),c=i%3,o=[];if(r>0)o.push(i-3);if(r<2)o.push(i+3);if(c>0)o.push(i-1);if(c<2)o.push(i+1);return o};
  let st;
  function intro(){
    const el=mount(topbar('ミニゲーム')+
      '<div class="body" style="justify-content:center;text-align:center;gap:.9em">'+
      '<div style="width:40%;margin:0 auto;animation:bob 3s infinite">'+beast(B.misemori)+'</div>'+
      '<div><p class="label">BRAIN GAME</p><h2 class="disp" style="font-size:2em;line-height:1.2">DDスキャン</h2></div>'+
      '<div class="card small" style="text-align:left;display:flex;flex-direction:column;gap:.4em">'+
      '<p>会社の9つの部屋のどこかに、<b style="color:var(--ember)">3つのリスク</b>が隠れている。</p>'+
      '<p>🔍 <b>調べる</b>：部屋を調査（回数に限りあり）。問題がなければ、<b style="color:var(--ember)">上下左右の部屋にあるリスクの数</b>がわかる。</p>'+
      '<p>🚩 <b>指摘する</b>：リスクがあると考えた部屋に印をつける。</p>'+
      '<p>手がかり（資料）と数字から推理して、3つ指摘したら報告！</p></div>'+
      '</div><div class="foot"><button class="btn" id="start">調査開始</button></div>','dark');
    bind(el);el.querySelector('#start').addEventListener('click',()=>play(Math.floor(Math.random()*PUZ.length)));
  }
  function play(pi){
    let bonus=0;try{bonus=sessionStorage.getItem('dt-ticket')?1:0}catch(e){}
    st={p:PUZ[pi],pi,left:4+bonus,bonus,mode:'scan',open:{},flag:{},done:false};
    st.p.open.forEach(i=>st.open[i]=1);
    draw();
  }
  function cellHTML(i){
    const P=st.p,r=P.risks[i];
    if(st.done){
      if(r)return '<button class="tile '+(st.flag[i]||st.open[i]?'risk':'missed')+'" disabled><span class="ico">'+(st.flag[i]||st.open[i]?'⚠':'?')+'</span><span class="res">'+r+(st.flag[i]||st.open[i]?'':'<br>見逃し')+'</span></button>';
      if(st.flag[i])return '<button class="tile safe" disabled style="outline:.15em dashed var(--ember);outline-offset:-.3em"><span class="ico">✕</span><span class="res">誤指摘</span></button>';
    }
    if(st.open[i]){
      if(r)return '<button class="tile risk" disabled><span class="ico">⚠</span><span class="res">'+r+'</span></button>';
      const n=NB(i).filter(j=>P.risks[j]).length;
      return '<button class="tile safe" disabled><span class="ico" style="font-family:var(--font-display);color:'+(n?'var(--ember)':'var(--leaf)')+'">'+n+'</span><span class="res">'+ROOMS[i][1]+'<br>問題なし</span></button>';
    }
    return '<button class="tile'+(st.flag[i]?' flagged':'')+'" data-i="'+i+'"><span class="ico">'+(st.flag[i]?'🚩':ROOMS[i][0])+'</span>'+ROOMS[i][1]+'</button>';
  }
  function found(){return Object.keys(st.p.risks).filter(i=>st.open[i]||st.flag[i]).length}
  function marks(){return Object.keys(st.flag).length+Object.keys(st.p.risks).filter(i=>st.open[i]).length}
  function draw(){
    const el=mount(topbar('DDスキャン','<span class="chip">ケース '+(st.pi+1)+'</span>')+
      '<div class="body">'+
      '<div class="pcard" style="padding:.7em .8em"><p class="label" style="color:#5b6b64">📁 手がかり（事前資料）</p>'+st.p.clues.map(c=>'<p class="small" style="line-height:1.5">・'+c+'</p>').join('')+'</div>'+
      '<div class="tabs" style="margin:0"><button class="'+(st.mode==='scan'?'on':'')+'" data-m="scan">🔍 調べる（残り'+st.left+'）</button><button class="'+(st.mode==='flag'?'on':'')+'" data-m="flag">🚩 指摘する（'+marks()+'/3）</button></div>'+
      (st.bonus?'<p class="xs" style="color:var(--leaf);text-align:center">🎟 調査チケット使用中：調べる回数 +1</p>':'')+
      '<div class="grid" id="grid">'+ROOMS.map((r,i)=>cellHTML(i)).join('')+'</div>'+
      '<p class="xs muted" style="text-align:center">数字＝上下左右の部屋にあるリスクの数</p>'+
      '</div><div class="foot"><button class="btn" id="rep" '+(marks()===3?'':'disabled')+'>報告する</button></div>','dark');
    bind(el);
    el.querySelectorAll('[data-m]').forEach(b=>b.addEventListener('click',()=>{st.mode=b.dataset.m;draw()}));
    el.querySelectorAll('.tile[data-i]').forEach(t=>t.addEventListener('click',()=>act(+t.dataset.i)));
    el.querySelector('#rep').addEventListener('click',report);
  }
  function act(i){
    if(st.mode==='scan'){
      if(st.left<=0){toast('調べる回数がありません','');return}
      if(st.flag[i])delete st.flag[i];
      st.left--;st.open[i]=1;draw();
      toast(st.p.risks[i]?'リスク発見！':'問題なし',st.p.risks[i]?'':'g');
      if(st.left===0&&!st.done&&marks()<3)later(()=>{st.mode='flag';draw()},700);
    }else{
      if(st.flag[i])delete st.flag[i];else if(marks()<3)st.flag[i]=1;else{toast('指摘は3つまで','');return}
      draw();
    }
  }
  function toast(msg,cls){const d=document.createElement('div');d.className='toast '+cls;d.textContent=msg;$stage.firstChild.appendChild(d);later(()=>d.remove(),900)}
  function report(){st.done=true;draw();$stage.querySelector('.foot').innerHTML='';later(result,1600)}
  function result(){
    const f=found(),wrong=Object.keys(st.flag).filter(i=>!st.p.risks[i]).length,scans=4+st.bonus-st.left;
    const r=f===3&&scans<=3?'S':f===3?'A':f===2?'B':'C';
    const cut=[0.8,0.6,0.5].slice(0,f).reduce((a,b)=>a+b,0);
    const msg={S:'少ない調査で全てのリスクを特定！ 推理が冴えています。',A:'全てのリスクを特定できました。次は調べる回数を減らせるかも。',B:'見逃したリスクは買収後に自社が背負います。契約の表明保証で備えましょう。',C:'手がかりと数字を組み合わせて、仮説を立ててから調べてみましょう。'}[r];
    try{sessionStorage.removeItem('dt-ticket')}catch(e){}
    const el=mount(topbar('結果')+
      '<div class="body" style="justify-content:center;gap:1em"><p class="label" style="text-align:center">あなたの目利きランク</p><div class="rank">'+r+'</div>'+

/* ---------- 2b. アクション：ブロックブレイク ---------- */
S.breaker=function(){
  function intro(){
    const pat=["222222222","1*11211*1","XX1XXX1XX","121212121","1X1X*X1X1"];

      '<p>白い縁のブロックは2回当てると壊れる。</p>'+
      '<p>金色のブロックからアイテムが落ちてくる：<br>'+'<span style="display:inline-grid;place-items:center;width:2.4em;height:1.1em;border-radius:99em;background:#8fb5ff;vertical-align:middle;margin-right:.4em"><i style="display:block;width:55%;height:.18em;background:#fff;border-radius:9em"></i></span>'+'バーが広がる　'+'<span style="display:inline-grid;place-items:center;width:2.4em;height:1.1em;border-radius:99em;background:#5fc192;vertical-align:middle;margin-right:.4em"><i style="display:block;width:1.1em;height:.3em;background:radial-gradient(circle,#fff 45%,transparent 50%) 0 0/.37em .3em repeat-x"></i></span>'+'ボールが3つに</p>'+
      '<p class="xs muted">操作：ドラッグ／マウスでバーを動かし、タップで発射。クリア報酬あり</p></div>'+
      '</div><div class="foot"><button class="btn" id="start">スタート</button></div>','dark');
    bind(el);el.querySelector('#start').addEventListener('click',play);
  }
  function play(){
    const el=mount(topbar('ブロックブレイク','<span class="chip" id="lv">❤❤❤</span><span class="chip ember mono" id="sc">0</span>')+
      '<div style="flex:1;min-height:0;position:relative;margin:0 .6em .8em;border-radius:1em;overflow:hidden;background:linear-gradient(180deg,#24504a,#2f5d63 60%,#3b5f6b)"><canvas id="cv" style="position:absolute;inset:0;width:100%;height:100%;touch-action:none"></canvas><div id="msg" style="position:absolute;left:0;right:0;bottom:22%;text-align:center;font-weight:900;color:#ffd29a;animation:glow 1.6s infinite">タップで発射</div></div>','dark');
    bind(el);
    const cv=el.querySelector('#cv'),ctx=cv.getContext('2d'),dpr=Math.min(2,window.devicePixelRatio||1);
    const box=cv.getBoundingClientRect();const W=box.width,H=box.height;cv.width=W*dpr;cv.height=H*dpr;ctx.scale(dpr,dpr);
    const MAP=["222222222","1*11211*1","XX1XXX1XX","121212121","1X1X*X1X1","212111212","X11X.X11X"];
    const COLS=9,ROWS=MAP.length,gap=W*.01,bw=(W-gap*(COLS+1))/COLS,bh=H*.032,top=H*.1;
    const COL=['#ef6b5b','#f0a14a','#ffd29a','#5fc192','#8fb5ff','#b48cff','#ef6b5b'];
    const bricks=[];let puN=0;
    MAP.forEach((row,r)=>row.split('').forEach((ch,c)=>{
      if(ch==='.')return;
      const b={x:gap+c*(bw+gap),y:top+r*(bh+gap),c:COL[r],hp:1,wall:false,pu:null};
      if(ch==='X'){b.wall=true;b.hp=1e9}
      if(ch==='2')b.hp=2;
      if(ch==='*'){b.pu=(puN++%2===0)?'W':'M';b.c='#ffe7b0'}
      bricks.push(b);
    }));
    const total=bricks.filter(b=>!b.wall).length;
    const pad={w:W*.24,h:H*.018,x:W/2,y:H*.92};
    let balls=[],caps=[],lives=3,score=0,launched=false,over=false,wideT=0;
    const R=W*.018,SPD=H*.62;
    function newBall(){balls=[{x:pad.x,y:pad.y-R-2,vx:0,vy:0}];launched=false;el.querySelector('#msg').hidden=false}
    newBall();
    function launch(){if(launched||over)return;launched=true;el.querySelector('#msg').hidden=true;const a=-Math.PI/2+(Math.random()*.6-.3);balls[0].vx=SPD*Math.cos(a);balls[0].vy=SPD*Math.sin(a)}
    function setX(clientX){const b=cv.getBoundingClientRect();pad.x=Math.max(pad.w/2,Math.min(W-pad.w/2,(clientX-b.left)/b.width*W))}
    cv.addEventListener('pointermove',e=>setX(e.clientX));
    cv.addEventListener('pointerdown',e=>{setX(e.clientX);launch()});
    const keys={};const kd=e=>{if(!document.body.contains(cv))return;if(e.key==='ArrowLeft'||e.key==='ArrowRight'){keys[e.key]=e.type==='keydown';e.preventDefault()}if(e.type==='keydown'&&e.key===' '){launch();e.preventDefault()}};
    window.addEventListener('keydown',kd);window.addEventListener('keyup',kd);
    function hud(){el.querySelector('#lv').textContent='❤'.repeat(lives)+'♡'.repeat(3-lives);el.querySelector('#sc').textContent=score}
    let last=performance.now();
    function step(now){
      if(!document.body.contains(cv)){window.removeEventListener('keydown',kd);window.removeEventListener('keyup',kd);return}
      const dt=Math.min(.033,(now-last)/1000);last=now;
      if(keys.ArrowLeft)pad.x=Math.max(pad.w/2,pad.x-W*1.2*dt);if(keys.ArrowRight)pad.x=Math.min(W-pad.w/2,pad.x+W*1.2*dt);
      if(wideT>0){wideT-=dt;if(wideT<=0)pad.w=W*.24}
      if(!launched){balls[0].x=pad.x;balls[0].y=pad.y-R-2}
      else if(!over){
        balls.forEach(b=>{
          b.x+=b.vx*dt;b.y+=b.vy*dt;
          if(b.x<R){b.x=R;b.vx=Math.abs(b.vx)}if(b.x>W-R){b.x=W-R;b.vx=-Math.abs(b.vx)}if(b.y<R){b.y=R;b.vy=Math.abs(b.vy)}
          if(b.vy>0&&b.y+R>=pad.y-pad.h/2&&b.y+R<=pad.y+pad.h&&Math.abs(b.x-pad.x)<=pad.w/2+R){
            const k=(b.x-pad.x)/(pad.w/2);const a=-Math.PI/2+k*1.05;const sp=Math.hypot(b.vx,b.vy);b.vx=sp*Math.cos(a);b.vy=sp*Math.sin(a);b.y=pad.y-pad.h/2-R}
          for(const br of bricks){if(br.hp<=0)continue;
            if(b.x+R>br.x&&b.x-R<br.x+bw&&b.y+R>br.y&&b.y-R<br.y+bh){
              const ox=Math.min(b.x+R-br.x,br.x+bw-(b.x-R)),oy=Math.min(b.y+R-br.y,br.y+bh-(b.y-R));
              if(ox<oy)b.vx=-b.vx;else b.vy=-b.vy;
              if(br.wall){break}br.hp--;if(br.hp<=0){score+=100;if(br.pu)caps.push({x:br.x+bw/2,y:br.y,t:br.pu})}else score+=20;
              hud();break}}
        });
        balls=balls.filter(b=>b.y-R<H);
        caps.forEach(c=>{c.y+=H*.28*dt;if(c.y>pad.y-pad.h&&c.y<pad.y+pad.h&&Math.abs(c.x-pad.x)<pad.w/2+bw*.3){c.got=true;
          if(c.t==='W'){pad.w=W*.38;wideT=10}else{const b0=balls[0]||{x:pad.x,y:pad.y-R,vx:0,vy:-SPD};const sp=SPD;[-.5,.5].forEach(a=>balls.push({x:b0.x,y:b0.y,vx:sp*Math.sin(a),vy:-sp*Math.cos(a)}))}
          score+=50;hud()}});
        caps=caps.filter(c=>!c.got&&c.y<H);
        if(balls.length===0){lives--;hud();if(lives<=0){over=true;later(()=>end(false),600)}else newBall()}
        if(bricks.every(b=>b.wall||b.hp<=0)){over=true;later(()=>end(true),700)}
      }
      // draw
      ctx.clearRect(0,0,W,H);
      bricks.forEach(b=>{if(b.hp<=0)return;
        if(b.wall){ctx.fillStyle='#050707';roundRect(b.x,b.y,bw,bh,bh*.2);ctx.fill();ctx.strokeStyle='#6f827a';ctx.lineWidth=1.5;ctx.stroke();ctx.fillStyle='rgba(255,255,255,.18)';ctx.fillRect(b.x+bh*.3,b.y+bh*.2,bw-bh*.6,bh*.12);return}
        ctx.fillStyle=b.c;roundRect(b.x,b.y,bw,bh,bh*.25);ctx.fill();
        ctx.fillStyle='rgba(255,255,255,.28)';ctx.fillRect(b.x+bh*.25,b.y+bh*.18,bw-bh*.5,bh*.18);
        if(b.hp>1){ctx.strokeStyle='rgba(255,255,255,.85)';ctx.lineWidth=2;roundRect(b.x+1,b.y+1,bw-2,bh-2,bh*.22);ctx.stroke()}
        if(b.pu){ctx.save();ctx.translate(b.x+bw/2,b.y+bh/2);ctx.rotate(Math.PI/4);ctx.fillStyle='#fff';const d=bh*.32;ctx.fillRect(-d/2,-d/2,d,d);ctx.restore()}
      });
      caps.forEach(c=>{const cw=bw*.6,ch=bh*.85;ctx.fillStyle=c.t==='W'?'#8fb5ff':'#5fc192';roundRect(c.x-cw/2,c.y,cw,ch,ch/2);ctx.fill();ctx.fillStyle='#fff';
        if(c.t==='W')ctx.fillRect(c.x-cw*.28,c.y+ch*.42,cw*.56,ch*.16);else[-1,0,1].forEach(k=>{ctx.beginPath();ctx.arc(c.x+k*cw*.2,c.y+ch/2,ch*.13,0,Math.PI*2);ctx.fill()})});
      const g=ctx.createLinearGradient(0,pad.y-pad.h,0,pad.y+pad.h);g.addColorStop(0,'#ffc477');g.addColorStop(1,'#c76d14');ctx.fillStyle=g;roundRect(pad.x-pad.w/2,pad.y-pad.h/2,pad.w,pad.h,pad.h/2);ctx.fill();
      balls.forEach(b=>{ctx.beginPath();ctx.arc(b.x,b.y,R,0,Math.PI*2);ctx.fillStyle='#ffd29a';ctx.fill();ctx.lineWidth=2;ctx.strokeStyle='#c76d14';ctx.stroke()});
      requestAnimationFrame(step);
    }
    function roundRect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
    requestAnimationFrame(step);
    function end(win){
      const stars=win?lives:0;
      if(win){try{sessionStorage.setItem('dt-ticket','1')}catch(e){}}
      const e=mount(topbar('ブロックブレイク')+
        '<div class="body" style="justify-content:center;gap:.9em;text-align:center">'+
        (win?'<p class="disp" style="font-size:1.8em;animation:pop .6s both">STAGE CLEAR!</p><p style="font-size:1.6em;color:var(--ember);letter-spacing:.1em">'+'★'.repeat(stars)+'<span style="opacity:.3">'+'★'.repeat(3-stars)+'</span></p>'+
          '<p class="label">クリア報酬</p>'+
          '<div class="merit" style="text-align:left"><span class="mi" style="background:#f0a14a">🪙</span><span class="grow"><span class="mt" style="display:block">ディールコイン</span><span class="md" style="display:block">ショップや街づくりに使える</span></span><span class="mv">+'+(200+stars*100)+'</span></div>'+

          '<div class="merit" style="text-align:left;animation-delay:.3s"><span class="mi" style="background:#8fb5ff">⛲</span><span class="grow"><span class="mt" style="display:block">街の装飾「噴水」</span><span class="md" style="display:block">ホームの街に飾れる</span></span><span class="mv">NEW</span></div>'+

        :'<p class="disp" style="font-size:1.6em">GAME OVER</p><p class="small">スコア '+score+'</p>'+tip('バーの端で打つと、角度がつけられます。青いアイテムを拾うとバーが広がりますよ。'))+

  }

      [D.n>=60?'g':D.n>=40?'w':'b','統合','なつき度 '+D.n+'・シナジー '+D.s]];

      '<button class="btn" data-go="merit">成功メリットを見る</button><button class="btn ghost" data-go="">目次へ戻る</button>');

};

S.merit=function(){

  function draw(){
    const lots=[['l1','18%','工業地区',''],['l2','40%','HQの隣','シナジー ×1.5'],['l3','70%','郊外','']];
    const el=mount(topbar('買収の成功メリット','<span class="chip ember">評価 '+g+'</span>')+
      '<div class="city">'+skyline({extra:placed!=null})+
      (placed==null?lots.map(l=>'<button class="lot" data-l="'+l[0]+'" style="left:'+l[1]+'">'+(l[3]?'<span class="syn chip ember">'+l[3]+'</span>':'')+l[2]+'</button>').join(''):
      '<div style="position:absolute;bottom:14%;left:'+lots.find(l=>l[0]===placed)[1]+';width:20%;animation:drop .8s both">'+beast(B.machi)+'</div>')+
      '</div>'+
      '<div class="body" style="background:var(--night);padding-top:1em">'+
      (placed==null?
        '<p class="disp" style="font-size:1.4em;text-align:center">案件クローズ！</p>'+tip('マチコウバを街に迎えましょう。<b>相性の良い会社の隣</b>に置くと、シナジーが大きくなります。')+'<p class="xs muted" style="text-align:center">↑ 建てる場所をタップ</p>'
        :merits())+
      '</div><div class="foot" style="background:var(--night)">'+(placed==null?'':'<button class="btn" data-go="shop">課金ポイントを見る</button>')+'<button class="btn ghost" data-go="">目次へ戻る</button></div>','dark');
    bind(el);
    el.querySelectorAll('.lot').forEach(b=>b.addEventListener('click',()=>{placed=b.dataset.l;draw();countUp()}));
  }
  function merits(){
    const syn=placed==='l2'?1.5:1;
    const val=(g==='S'?9.6:g==='A'?8.0:g==='B'?6.2:4.0)*syn;
    const M=[
      ['🏙','グループ企業価値','買収した会社の価値＋シナジー','<span id="cu" data-to="'+val.toFixed(1)+'">+0.0</span>億','#f0a14a'],
      ['⚡','シナジー効果'+(syn>1?'（隣接ボーナス ×1.5）':''),'技術スキル「精密加工」を獲得。自社製品の品質+20%','+'+Math.round(15*syn)+'%','#5fc192'],
      ['🗺','新エリア解放','工業地区の奥に「物流港」への道が開いた','NEW','#8fb5ff'],
      ['🎖','ランクアップ','アナリスト → アソシエイト。より大きな案件へ','UP','#ffd29a'],
      ['📘','図鑑・用語カード','マチコウバを図鑑に登録。用語カード8枚','+8','#ef6b5b']];
    return M.map((m,i)=>'<div class="merit" style="animation-delay:'+(i*150)+'ms"><span class="mi" style="background:'+m[4]+'">'+m[0]+'</span><span class="grow"><span class="mt" style="display:block">'+m[1]+'</span><span class="md" style="display:block">'+m[2]+'</span></span><span class="mv">'+m[3]+'</span></div>').join('')+
      tip('M&Aの成果が、<b>街の発展</b>として目に見える。これが続けたくなる理由になります。');
  }
  function countUp(){
    const e=$stage.querySelector('#cu');if(!e)return;const to=+e.dataset.to;let v=0;
    const t=every(()=>{v=Math.min(to,v+to/24);e.textContent='+'+v.toFixed(1);if(v>=to)clearInterval(t)},40);
  }
  draw();
};

const GL_RE=new RegExp(Object.keys(GL).sort((a,b)=>b.length-a.length).map(k=>k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|'),'g');
let glSeen=new Set();
function markTerms(root){
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode(n){
    const p=n.parentElement;if(!p||p.closest('svg,.term,.modal,.logo,.rank,.back,script,style,.mono,.price,.ticks,h2.disp,.ttl,.idx-item .t'))return NodeFilter.FILTER_REJECT;
    GL_RE.lastIndex=0;return GL_RE.test(n.nodeValue)?NodeFilter.FILTER_ACCEPT:NodeFilter.FILTER_REJECT}});
  const nodes=[];while(w.nextNode())nodes.push(w.currentNode);
  nodes.forEach(n=>{
    const txt=n.nodeValue;let last=0,m,frag=document.createDocumentFragment(),changed=false;GL_RE.lastIndex=0;
    while((m=GL_RE.exec(txt))){
      const key=m[0];if(glSeen.has(key))continue;glSeen.add(key);changed=true;
      frag.appendChild(document.createTextNode(txt.slice(last,m.index)));
      const sp=document.createElement('span');sp.className='term';sp.dataset.term=key;sp.textContent=key;
      const q=document.createElement('span');q.className='q';q.dataset.term=key;q.setAttribute('role','button');q.setAttribute('tabindex','0');q.setAttribute('aria-label',key+'の説明');q.textContent='!';
      sp.appendChild(q);frag.appendChild(sp);last=m.index+key.length;
    }
    if(!changed)return;frag.appendChild(document.createTextNode(txt.slice(last)));n.parentNode.replaceChild(frag,n);
  });
}
function openTerm(key){
  const g=GL[key];if(!g)return;
  const m=document.createElement('div');m.className='modal';
  m.innerHTML='<div class="sheet" role="dialog" aria-modal="true" aria-label="'+g[0]+'"><div class="hd"><div class="face">'+minato()+'</div><div class="grow"><span class="chip ember kind">用語カード</span><p class="tn" style="margin-top:.3em">'+g[0]+'</p><p class="en">'+g[1]+'</p></div></div>'+
    '<p class="ex">'+g[2]+'</p>'+(g[3]?'<p class="gm"><b>ゲームでは</b>　'+g[3]+'</p>':'')+'<button class="btn" data-close>わかった</button></div>';
  $stage.appendChild(m);m.querySelector('[data-close]').focus();
  m.addEventListener('click',e=>{if(e.target===m||e.target.closest('[data-close]')){e.stopPropagation();m.remove()}});
}
$stage.addEventListener('click',e=>{
  const q=e.target.closest('.q')||(!e.target.closest('button')&&e.target.closest('.term'));
  if(q){e.stopPropagation();e.preventDefault();openTerm(q.dataset.term)}
},true);
$stage.addEventListener('keydown',e=>{const q=e.target.closest&&e.target.closest('.q');if(q&&(e.key==='Enter'||e.key===' ')){e.preventDefault();e.stopPropagation();openTerm(q.dataset.term)}
  if(e.key==='Escape'){const m=$stage.querySelector('.modal');if(m)m.remove()}},true);
new MutationObserver(ms=>{ms.forEach(r=>r.addedNodes.forEach(n=>{if(n.nodeType===1&&!n.closest('.modal')&&!n.classList.contains('term'))markTerms(n)}))}).observe($stage,{childList:true,subtree:true});

window.addEventListener('hashchange',route);
route();
